name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libasound2-dev \
            libzstd-dev pkg-config
      - name: Core without GPUI
        run: cargo build --no-default-features --lib
      - name: Test (with the UI)
        run: cargo test --all-targets
      - name: Lint
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --no-default-features --lib -- -D warnings
